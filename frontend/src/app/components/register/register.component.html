<!-- register.component.html -->
<div style="max-width: 450px; margin: 40px auto; padding: 30px; border: 1px solid #ddd; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">
  <h2 style="text-align: center; color: #2c3e50;">Open Digital Bank Account</h2>
  
  <div *ngIf="errorMessage" style="background: #f8d7da; color: #721c24; padding: 10px; border-radius: 4px; margin-bottom: 15px;">
    {{ errorMessage }}
  </div>

  <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
    <div style="display: flex; gap: 10px; margin-bottom: 15px;">
      <div style="flex: 1;">
        <label>First Name</label>
        <input type="text" formControlName="firstName" style="width: 100%; padding: 10px; margin-top: 5px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px;">
      </div>
      <div style="flex: 1;">
        <label>Last Name</label>
        <input type="text" formControlName="lastName" style="width: 100%; padding: 10px; margin-top: 5px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px;">
      </div>
    </div>

    <div style="margin-bottom: 15px;">
      <label>Email Address</label>
      <input type="email" formControlName="email" style="width: 100%; padding: 10px; margin-top: 5px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px;">
    </div>

    <div style="margin-bottom: 15px;">
      <label>Password</label>
      <input type="password" formControlName="password" style="width: 100%; padding: 10px; margin-top: 5px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px;">
    </div>

    <div style="margin-bottom: 20px;">
      <label>Phone Number</label>
      <input type="text" formControlName="phoneNumber" placeholder="+1234567890" style="width: 100%; padding: 10px; margin-top: 5px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px;">
    </div>

    <button type="submit" [disabled]="registerForm.invalid || loading" style="width: 100%; padding: 12px; background: #2ecc71; color: white; border: none; border-radius: 4px; font-size: 16px; cursor: pointer;">
      {{ loading ? 'Creating Account...' : 'Register' }}
    </button>
  </form>

  <p style="text-align: center; margin-top: 20px;">
    Already registered? <a routerLink="/login" style="color: #3498db;">Log in here</a>
  </p>
</div>
