<nav class="navbar">
  <div class="nav-brand" routerLink="/dashboard">
    <span class="brand-icon">🏛️</span>
    <span class="brand-name">Aether<span class="brand-accent">Bank</span></span>
  </div>

  <div *ngIf="authService.isLoggedIn()" class="nav-menu">
    <a routerLink="/dashboard" routerLinkActive="active-link" class="nav-item">Dashboard</a>
    <a routerLink="/accounts" routerLinkActive="active-link" class="nav-item">Accounts</a>
    <a routerLink="/transfer" routerLinkActive="active-link" class="nav-item">Transfer</a>
    <a routerLink="/transactions" routerLinkActive="active-link" class="nav-item">Statements</a>
    <a *ngIf="authService.isAdmin()" routerLink="/admin" class="nav-item admin-badge">Admin Panel</a>

    <!-- User Profile Avatar Pill -->
    <a routerLink="/profile" class="user-profile-pill" routerLinkActive="active-pill">
      <div class="nav-avatar">{{ initials }}</div>
      <span class="nav-username">{{ currentUser?.firstName }}</span>
    </a>

    <button (click)="logout()" class="btn-logout">
      Sign Out
    </button>
  </div>
</nav>
