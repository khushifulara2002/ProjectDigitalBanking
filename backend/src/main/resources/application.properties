# ====================================================================
# APPLICATION CONFIGURATION
# ====================================================================
spring.application.name=digital-banking
server.port=8080

# ====================================================================
# MYSQL DATABASE CONFIGURATION
# ====================================================================
spring.datasource.url=jdbc:mysql://localhost:3306/digital_bank_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ====================================================================
# JPA / HIBERNATE CONFIGURATION
# ====================================================================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ====================================================================
# JWT & SECURITY CUSTOM CONFIGURATION
# ====================================================================
app.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
app.jwt.expiration-ms=86400000


# ====================================================================
# SWAGGER / OPENAPI CONFIGURATION
# ====================================================================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.packages-to-scan=com.bank.digitalbanking.controller   